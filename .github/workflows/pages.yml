name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend for GitHub Pages
        working-directory: frontend
        env:
          RENDER_SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
          VITE_API_URL: ${{ vars.RENDER_SERVICE_URL }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          if [ -z "$RENDER_SERVICE_URL" ]; then
            echo "Set the RENDER_SERVICE_URL repository variable to the verified Render API URL."
            exit 1
          fi
          case "$RENDER_SERVICE_URL" in
            https://*) ;;
            *)
              echo "RENDER_SERVICE_URL must be an HTTPS URL."
              exit 1
              ;;
          esac
          service_url="${RENDER_SERVICE_URL%/}"
          health=$(curl --silent --show-error --fail --retry 5 --retry-connrefused --retry-delay 10 --retry-max-time 90 "$service_url/api/health")
          if ! printf '%s' "$health" | jq -e '.success == true and .service == "Online Hospital Appointment Management System (DFA Engine)" and .database.connected == true' >/dev/null; then
            echo "RENDER_SERVICE_URL did not return the connected Hospital DFA backend health response."
            exit 1
          fi
          doctors=$(curl --silent --show-error --fail "$service_url/api/doctors")
          if ! printf '%s' "$doctors" | jq -e '.success == true and (.data.doctors | type == "array")' >/dev/null; then
            echo "RENDER_SERVICE_URL did not return the Hospital DFA doctors API response."
            exit 1
          fi
          dfa=$(curl --silent --show-error --fail "$service_url/api/dfa/definition")
          if ! printf '%s' "$dfa" | jq -e '.success == true and (.data.transitions | length == 11)' >/dev/null; then
            echo "RENDER_SERVICE_URL did not return the Hospital DFA definition."
            exit 1
          fi
          npm run build
          cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy:
    name: Publish GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
