name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend for GitHub Pages
        working-directory: frontend
        env:
          RENDER_SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
          VITE_API_URL: ${{ vars.RENDER_SERVICE_URL }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          if [ -z "$RENDER_SERVICE_URL" ]; then
            echo "Set the RENDER_SERVICE_URL repository variable to the verified Render API URL."
            exit 1
          fi
          case "$RENDER_SERVICE_URL" in
            https://*) ;;
            *)
              echo "RENDER_SERVICE_URL must be an HTTPS URL."
              exit 1
              ;;
          esac
          npm run build
          cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy:
    name: Publish GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
