name: Test, Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  RENDER_SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: ci-only-secret-that-is-long-enough-for-tests
        run: npm test

  build:
    name: Build application
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy application
    runs-on: ubuntu-latest
    needs: [test, build]
    timeout-minutes: 10
    steps:
      - name: Verify Render deploy hook is configured
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Configure the RENDER_DEPLOY_HOOK_URL repository secret in GitHub."
            exit 1
          fi
          if [ -z "$RENDER_SERVICE_URL" ]; then
            echo "Configure the RENDER_SERVICE_URL repository variable in GitHub."
            exit 1
          fi
          case "$RENDER_SERVICE_URL" in
            https://*) ;;
            *)
              echo "RENDER_SERVICE_URL must be an HTTPS URL."
              exit 1
              ;;
          esac

      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            "$RENDER_DEPLOY_HOOK_URL"

          echo "Render deploy requested for [$RENDER_SERVICE_URL]($RENDER_SERVICE_URL)." >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for backend health
        run: |
          service_url="${RENDER_SERVICE_URL%/}"
          expected_service="Online Hospital Appointment Management System (DFA Engine)"
          healthy=false

          for attempt in $(seq 1 30); do
            response=$(curl --silent --show-error --fail --max-time 10 "$service_url/api/health" 2>/dev/null || true)

            if [ -n "$response" ]; then
              service=$(printf '%s' "$response" | jq -r '.service // empty' 2>/dev/null || true)
              if [ "$service" != "$expected_service" ]; then
                echo "RENDER_SERVICE_URL is not serving the Hospital DFA backend." >&2
                exit 1
              fi

              if printf '%s' "$response" | jq -e '.success == true and .database.connected == true' >/dev/null 2>&1; then
                healthy=true
                break
              fi
            fi

            echo "Waiting for Render backend health (attempt $attempt/30)..."
            sleep 10
          done

          if [ "$healthy" != true ]; then
            echo "Hospital DFA backend did not report a connected database within 5 minutes." >&2
            exit 1
          fi

          doctors=$(curl --silent --show-error --fail --max-time 15 "$service_url/api/doctors") || {
            echo "Hospital DFA /api/doctors request failed." >&2
            exit 1
          }
          if ! printf '%s' "$doctors" | jq -e '.success == true and (.data.doctors | type == "array")' >/dev/null; then
            echo "Hospital DFA /api/doctors returned an unexpected response." >&2
            exit 1
          fi

          dfa=$(curl --silent --show-error --fail --max-time 15 "$service_url/api/dfa/definition") || {
            echo "Hospital DFA /api/dfa/definition request failed." >&2
            exit 1
          }
          if ! printf '%s' "$dfa" | jq -e '.success == true and (.data.transitions | length == 11)' >/dev/null; then
            echo "Hospital DFA definition returned an unexpected response." >&2
            exit 1
          fi

          for route in /api/appointments /api/auth/me /api/admin/overview; do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 15 "$service_url$route" || true)
            if [ "$status" != "401" ]; then
              echo "Expected unauthenticated request to $route to return HTTP 401; received $status." >&2
              exit 1
            fi
          done

          cors_headers=$(curl --silent --show-error --include --max-time 15 \
            --request OPTIONS \
            --header "Origin: https://hariss-12.github.io" \
            --header "Access-Control-Request-Method: GET" \
            "$service_url/api/doctors")
          if ! printf '%s' "$cors_headers" | grep -qi '^access-control-allow-origin: https://hariss-12.github.io'; then
            echo "Backend CORS does not allow the GitHub Pages origin." >&2
            exit 1
          fi

          echo "Hospital DFA backend, database, API routes, and CORS are healthy at [$service_url]($service_url)." >> "$GITHUB_STEP_SUMMARY"
